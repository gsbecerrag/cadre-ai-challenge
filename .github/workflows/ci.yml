name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here reaches OpenRouter, Firestore, Langfuse, Daily or Firebase Auth: the unit
# suites run against the stub provider and in-memory implementations, so CI needs no secret.
jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The version comes from web/package.json's packageManager field; naming it here
          # as well makes the action fail with "Multiple versions of pnpm specified".
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Lint, typecheck and unit test
        run: make check
