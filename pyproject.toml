[project]
name = "cadre-support-agent"
version = "0.1.0"
description = "Cadre AI Support Agent — FastAPI API and the built web app in one Cloud Run container."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    # The ConversationStore's database. Its async client is imported only inside
    # core/adapters/firestore_store.py, which is the only place that knows Firestore exists.
    "google-cloud-firestore>=2.21",
    # The OpenRouter adapter's HTTP client. No vendor SDK sits between us and the provider's
    # streaming quirks (ADR-0004), so a streaming HTTP client is a runtime dependency.
    "httpx2>=2.12",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core"]
exclude = ["**/tests/**"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["api", "core"]
# Adopted skills and planning scratch space are vendored prose/scripts, not our source;
# markdown is documentation, so its illustrative code blocks are not ours to reformat.
extend-exclude = [".claude", ".scratch", ".superpowers", "external_assets", "*.md"]

[tool.ruff.lint]
select = [
    "ANN", # every function is annotated (mypy strict needs it, reviewers read it)
    "B",   # bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import order
    "N",   # pep8 naming
    "RUF",
    "T20", # no print — logging goes through core.logging (global constraint 8)
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["api", "core"]

[tool.mypy]
python_version = "3.12"
files = ["api", "core"]
strict = true

[tool.pytest.ini_options]
testpaths = ["api/tests", "core/tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
